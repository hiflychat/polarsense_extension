name: polarsense_extension
description: "A Flutter extension for Polar Verity Sense providing sedentary reminders, sleep & recovery tracking, and health ecosystem sync."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  # Polar Hardware SDK
  polar: ^7.12.0

  # Background execution
  flutter_foreground_task: ^8.0.0

  # Local database storage
  sqflite: ^2.3.0
  path: ^1.9.0

  # State management
  flutter_riverpod: ^2.5.0

  # Notifications
  flutter_local_notifications: ^17.0.0

  # Data visualization
  fl_chart: ^0.70.0

  # Apple HealthKit & Google Health Connect
  health: ^11.0.0

  # Permissions & Utilities
  permission_handler: ^12.0.2
  intl: ^0.19.0
  uuid: ^4.3.0

dependency_overrides:
  permission_handler: 12.0.2
  device_info_plus: ^13.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
