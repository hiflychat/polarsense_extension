name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub web UI

jobs:
  build-apk:
    name: Build PolarSense Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Gradle Mirrors
        run: |
          mkdir -p ~/.gradle/init.d
          cat << 'EOF' > ~/.gradle/init.d/mirror.init.gradle
          allprojects {
              buildscript {
                  repositories {
                      all { ArtifactRepository repo ->
                          if (repo instanceof MavenArtifactRepository) {
                              def u = repo.url.toString()
                              if (u.contains("repo.maven.apache.org") || u.contains("repo1.maven.org")) {
                                  repo.url = uri("https://maven.aliyun.com/repository/public")
                              }
                          }
                      }
                  }
              }
              repositories {
                  all { ArtifactRepository repo ->
                      if (repo instanceof MavenArtifactRepository) {
                          def u = repo.url.toString()
                          if (u.contains("repo.maven.apache.org") || u.contains("repo1.maven.org")) {
                              repo.url = uri("https://maven.aliyun.com/repository/public")
                          }
                      }
                  }
              }
          }
          EOF

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Patch Flutter Tool Gradle Repositories
        run: |
          if [ -d "$FLUTTER_ROOT/packages/flutter_tools/gradle" ]; then
            find "$FLUTTER_ROOT/packages/flutter_tools/gradle" -type f \( -name "*.kts" -o -name "*.gradle" \) -exec sed -i 's|mavenCentral()|maven("https://maven.aliyun.com/repository/public")|g' {} +
            echo "Patched Flutter tools Gradle repositories to Aliyun mirror"
          fi

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: polarsense-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
